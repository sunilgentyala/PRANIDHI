<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="PRANIDHI: pre-prompt coaching for enterprise AI. Pipeline: user prompt, IDL, CRSE, Nudging Engine, PEOL, TAALL, target LLM.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1917"/>
      <stop offset="100%" stop-color="#2b1810"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#D85A30" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#D85A30" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#8f8a7f"/>
    </marker>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- faint scan rings -->
  <g fill="none" stroke="#D85A30" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 9">
    <circle cx="128" cy="112" r="96"/>
    <circle cx="128" cy="112" r="140"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(58,42) scale(0.7)">
    <rect x="8" y="8" width="184" height="184" rx="44" fill="#0d0c0a"/>
    <rect x="8.5" y="8.5" width="183" height="183" rx="43.5" fill="none" stroke="#3a3733"/>
    <path d="M34,100 Q100,52 166,100 Q100,148 34,100 Z" fill="#F4EFE8"/>
    <circle cx="100" cy="100" r="33" fill="#993C1D"/>
    <circle cx="100" cy="100" r="33" fill="none" stroke="#D85A30" stroke-width="2"/>
    <circle cx="100" cy="100" r="14" fill="#14100D"/>
    <circle cx="93" cy="93" r="5" fill="#F4EFE8" opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="236" y="86" font-size="34" fill="#F08A62" font-family="'Noto Sans Devanagari','Nirmala UI','Mangal','Segoe UI',sans-serif">प्रणिधि</text>
    <text x="234" y="152" font-size="68" font-weight="800" letter-spacing="1" fill="#F4EFE8">PRANIDHI</text>
    <text x="236" y="186" font-size="17" fill="#bdb8ad">Prompt Risk Analysis, Network Inspection &amp; Data Handling Integrity</text>
    <text x="236" y="222" font-size="21" font-weight="600" fill="#F4EFE8">Pre-prompt coaching for enterprise AI: teach users, don't just block them.</text>
  </g>

  <!-- version pill -->
  <g font-family="'Segoe UI', -apple-system, Arial, sans-serif">
    <rect x="988" y="38" width="240" height="36" rx="18" fill="#3a2118" stroke="#D85A30" stroke-opacity="0.6"/>
    <circle cx="1010" cy="56" r="5" fill="#97C459"/>
    <text x="1024" y="62" font-size="15" font-weight="600" fill="#F4EFE8">v0.2.0 · security-hardened</text>
  </g>

  <!-- pipeline strip -->
  <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" text-anchor="middle">
    <!-- connectors -->
    <g stroke="#8f8a7f" stroke-width="1.8" marker-end="url(#arr)">
      <line x1="196" y1="292" x2="224" y2="292"/>
      <line x1="364" y1="292" x2="392" y2="292"/>
      <line x1="532" y1="292" x2="560" y2="292"/>
      <line x1="700" y1="292" x2="728" y2="292"/>
      <line x1="868" y1="292" x2="896" y2="292"/>
      <line x1="1036" y1="292" x2="1064" y2="292"/>
    </g>

    <rect x="58" y="258" width="138" height="68" rx="12" fill="#26231f" stroke="#4a463f"/>
    <text x="127" y="287" font-size="16" font-weight="600" fill="#F4EFE8">User prompt</text>
    <text x="127" y="308" font-size="12" fill="#a8a69d">untrusted input</text>

    <rect x="226" y="258" width="138" height="68" rx="12" fill="#14283d" stroke="#3b7bbf"/>
    <text x="295" y="287" font-size="16" font-weight="700" fill="#9ccaf5">IDL</text>
    <text x="295" y="308" font-size="12" fill="#a8c4e0">normalise, decompose</text>

    <rect x="394" y="258" width="138" height="68" rx="12" fill="#231f40" stroke="#7a70e0"/>
    <text x="463" y="287" font-size="16" font-weight="700" fill="#c3bdf5">CRSE</text>
    <text x="463" y="308" font-size="12" fill="#bdb8e0">score the risk</text>

    <rect x="562" y="254" width="138" height="76" rx="12" fill="#5a2415" stroke="#F08A62" stroke-width="2.5"/>
    <text x="631" y="285" font-size="15" font-weight="800" fill="#FFD2BF">Nudging Engine</text>
    <text x="631" y="308" font-size="12" fill="#F5B79A">coach before enforcing</text>

    <rect x="730" y="258" width="138" height="68" rx="12" fill="#10332b" stroke="#2aa889"/>
    <text x="799" y="287" font-size="16" font-weight="700" fill="#8fe3c9">PEOL</text>
    <text x="799" y="308" font-size="12" fill="#a0d4c4">tightening-only policy</text>

    <rect x="898" y="258" width="138" height="68" rx="12" fill="#25330f" stroke="#7fb336"/>
    <text x="967" y="287" font-size="16" font-weight="700" fill="#c4e690">TAALL</text>
    <text x="967" y="308" font-size="12" fill="#b9cf9a">private telemetry</text>

    <rect x="1066" y="258" width="162" height="68" rx="12" fill="#26231f" stroke="#4a463f"/>
    <text x="1147" y="283" font-size="16" font-weight="600" fill="#F4EFE8">Target LLM</text>
    <circle cx="1105" cy="304" r="5" fill="#97C459"/><circle cx="1147" cy="304" r="5" fill="#EF9F27"/><circle cx="1189" cy="304" r="5" fill="#E24B4A"/>
    <text x="1117" y="319" font-size="0" fill="none"></text>
  </g>
  <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="11" fill="#a8a69d" text-anchor="middle">
    <text x="1105" y="338">proceed</text><text x="1147" y="338">coach</text><text x="1189" y="338">block</text>
  </g>
</svg>
